<div class="app" id="app">
  <header class="titlebar" id="titlebar">
    <div class="tb-brand"><img src="icon.png" alt="" width="20" height="20"><span class="tb-name">ForeverNote</span><span class="tb-by">by revmpt</span></div>
    <div class="tb-nav">
      <button class="ib sm" id="navBack" title="Voltar (Alt+←)" aria-label="Voltar"><svg class="i"><use href="#i-left"/></svg></button>
      <button class="ib sm" id="navFwd" title="Avançar (Alt+→)" aria-label="Avançar"><svg class="i"><use href="#i-right"/></svg></button>
    </div>
    <div class="tabs" id="tabs" role="tablist" aria-label="Notas abertas"></div>
    <button class="ib sm tab-add" id="tabAdd" title="Nova nota (Ctrl+N)" aria-label="Nova nota"><svg class="i"><use href="#i-plus"/></svg></button>
    <div class="tb-drag"></div>
  </header>

  <div class="body" id="body">
    <aside class="sidebar" id="sidebar" aria-label="Navegação">
      <label class="search" id="searchBox">
        <svg class="i"><use href="#i-search"/></svg>
        <input id="search" type="search" placeholder="Pesquisar" autocomplete="off" spellcheck="false">
        <kbd>Ctrl+K</kbd>
      </label>
      <div class="side-actions">
        <div class="new-split"><button class="btn-new" id="sideNew" title="Nova nota (Ctrl+N)"><svg class="i"><use href="#i-note-add"/></svg><span>Nota</span></button><button class="btn-new-more" id="sideNewTpl" title="Criar a partir de modelo" aria-label="Criar a partir de modelo"><svg class="i"><use href="#i-chev-d"/></svg></button></div>
        <button class="ib" id="sideNewNb" title="Novo caderno (Ctrl+Shift+N)" aria-label="Novo caderno"><svg class="i"><use href="#i-book"/></svg></button>
        <button class="ib" id="sideSettings" title="Configurações" aria-label="Configurações"><svg class="i"><use href="#i-gear"/></svg></button>
      </div>
      <nav class="side-scroll" id="sideNav"></nav>
      <div class="side-foot">
        <span class="save-dot" id="saveDot"></span><span id="saveText">Tudo salvo</span>
      </div>
    </aside>
    <div class="drawer-scrim" id="drawerScrim"></div>

    <section class="list" id="list" aria-label="Lista de notas">

        <div class="list-title-row">

          <span class="list-count" id="listCount">0</span>
        </div>

          <span class="list-sub" id="listSub"></span>
          <div class="list-actions">
            <button class="ib" id="listNew" title="Nova nota" aria-label="Nova nota"><svg class="i"><use href="#i-note-add"/></svg></button>
            <button class="ib" id="listFilter" title="Filtrar" aria-label="Filtrar notas"><svg class="i"><use href="#i-filter"/></svg><span class="badge" id="filterBadge" hidden></span></button>
            <button class="ib" id="listPick" title="Selecionar várias notas (Ctrl+clique, Shift+clique, Ctrl+A)" aria-label="Selecionar várias notas"><svg class="i"><use href="#i-check-list"/></svg></button>
            <button class="ib" id="listSort" title="Classificar" aria-label="Classificar notas"><svg class="i"><use href="#i-sort"/></svg></button>
          </div>
        </div>
        <div class="chips-row" id="activeChips" hidden></div>
      </div>
      <div class="notes" id="notes"></div>
      <div class="bulk" id="bulk" hidden></div>
      <div class="trash-drop" id="trashDrop" aria-hidden="true"><svg class="i"><use href="#i-trash"/></svg><span>Solte aqui para mover para a lixeira</span></div>
    </section>

    <main class="editor-pane" id="pane"></main>
  </div>
</div>
<div id="layer"></div>
<input type="file" id="imgInput" accept="image/*" multiple hidden>
<script src="app.js"></script>
</body>
</html>
