<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:; font-src 'self' data:; media-src 'self' blob: anexo:; connect-src 'self' anexo: blob:">
<title>Nota rápida</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="quick.css">
</head>
<body class="quick-body">
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="i-open" viewBox="0 0 20 20"><path d="M11 3.5h5.5V9M16.5 3.5L9.5 10.5M14 12v3a1.5 1.5 0 0 1-1.5 1.5H5A1.5 1.5 0 0 1 3.5 15V7.5A1.5 1.5 0 0 1 5 6h3"/></symbol>
  <symbol id="i-more" viewBox="0 0 20 20"><circle cx="4.5" cy="10" r=".9"/><circle cx="10" cy="10" r=".9"/><circle cx="15.5" cy="10" r=".9"/></symbol>
  <symbol id="i-book" viewBox="0 0 20 20"><path d="M4.5 15.5v-11A1.5 1.5 0 0 1 6 3h9.5v11.5H6a1.5 1.5 0 0 0-1.5 1.5A1.5 1.5 0 0 0 6 17.5h9.5"/><path d="M8 6.5h4.5"/></symbol>
  <symbol id="i-chev-d" viewBox="0 0 20 20"><path d="M6 8l4 4 4-4"/></symbol>
  <symbol id="i-check" viewBox="0 0 20 20"><path d="M4.5 10.5l3.5 3.5 7.5-8"/></symbol>
  <symbol id="i-copy" viewBox="0 0 20 20"><rect x="7" y="7" width="9.5" height="9.5" rx="2"/><path d="M13 7V5a1.5 1.5 0 0 0-1.5-1.5h-6A1.5 1.5 0 0 0 4 5v6A1.5 1.5 0 0 0 5.5 12.5H7"/></symbol>
  <symbol id="i-trash" viewBox="0 0 20 20"><path d="M4 6h12M8 6V4.5h4V6M5.5 6l.7 10h7.6l.7-10"/></symbol>
  <symbol id="i-pin" viewBox="0 0 20 20"><path d="M12.5 3.5l4 4-2.5 1-3 3 .5 3.5-1.5 1.5-3-3L3.5 17 3 16.5l3.5-3.5-3-3L5 8.5l3.5.5 3-3z"/></symbol>
  <symbol id="i-app" viewBox="0 0 20 20"><rect x="3" y="4" width="14" height="12" rx="2.5"/><path d="M7.5 4v12"/></symbol>
  <symbol id="i-mic" viewBox="0 0 20 20"><rect x="7.5" y="2.5" width="5" height="9.5" rx="2.5"/><path d="M4.5 9.5a5.5 5.5 0 0 0 11 0M10 15v2.5M7.5 17.5h5"/></symbol>
  <symbol id="i-play" viewBox="0 0 20 20"><path d="M6.5 4.5v11l9-5.5z" fill="currentColor" stroke-linejoin="round"/></symbol>
  <symbol id="i-pause" viewBox="0 0 20 20"><path d="M7 4.5v11M13 4.5v11" stroke-width="2.6"/></symbol>
  <symbol id="i-stop" viewBox="0 0 20 20"><rect x="5.5" y="5.5" width="9" height="9" rx="2" fill="currentColor"/></symbol>
  <symbol id="i-x" viewBox="0 0 20 20"><path d="M5.5 5.5l9 9M14.5 5.5l-9 9"/></symbol>
  <symbol id="i-text-wave" viewBox="0 0 20 20"><path d="M3 6h8M3 10h6M3 14h8M14 7v6M16.5 5v10M11.5 9v2"/></symbol>
  <symbol id="i-note-add" viewBox="0 0 20 20"><path d="M11.5 3H6a1.5 1.5 0 0 0-1.5 1.5v11A1.5 1.5 0 0 0 6 17h8a1.5 1.5 0 0 0 1.5-1.5V7z"/><path d="M11.5 3v4h4M10 9.5v5M7.5 12h5"/></symbol>
</defs></svg>

<div class="qn" id="qn">
  <header class="qn-head">
    <img src="../build/icon.png" alt="" width="18" height="18">
    <h1>Nota rápida</h1>
    <button class="ib" id="qExpand" title="Abrir no ForeverNote" aria-label="Abrir no ForeverNote"><svg class="i"><use href="#i-open"/></svg></button>
    <button class="ib" id="qMore" title="Mais ações" aria-label="Mais ações"><svg class="i"><use href="#i-more"/></svg></button>
  </header>
  <div class="qn-editor">
    <textarea id="qText" spellcheck="true" placeholder="Comece a escrever ou toque no microfone…&#10;A primeira linha vira o título da nota.&#10;&#10;Ctrl+Alt+N abre esta janela a qualquer momento."></textarea>
    <span class="qn-count" id="qCount"></span>
  </div>
  <div class="qn-audios" id="qAudios"></div>
  <div class="qn-banner" id="qBanner" hidden></div>
  <div class="qn-rec" id="qRec" hidden>
    <span class="rec-dot"></span><span class="qn-rec-time" id="qRecTime">0:00</span>
    <div class="qn-rec-wave" id="qRecWave"></div>
    <button class="ib" id="qRecPause" title="Pausar" aria-label="Pausar"><svg class="i"><use href="#i-pause"/></svg></button>
    <button class="qn-rec-stop" id="qRecStop"><svg class="i"><use href="#i-stop"/></svg>Concluir</button>
    <button class="ib" id="qRecCancel" title="Descartar" aria-label="Descartar"><svg class="i"><use href="#i-x"/></svg></button>
  </div>
  <footer class="qn-foot" id="qFoot">
    <button class="qn-nb" id="qNb" title="Caderno onde a nota será salva"><svg class="i"><use href="#i-book"/></svg><span id="qNbName">Caderno</span><svg class="i caret"><use href="#i-chev-d"/></svg></button>
    <span class="grow"></span>
    <button class="qn-mic" id="qMic" title="Gravar nota por voz" aria-label="Gravar nota por voz"><svg class="i"><use href="#i-mic"/></svg></button>
    <button class="btn primary" id="qConvert" disabled title="Ctrl+Enter"><svg class="i"><use href="#i-note-add"/></svg>Converter para nota</button>
  </footer>
    <div class="qn-done" id="qDone" hidden>
    <svg viewBox="0 0 72 72"><circle cx="36" cy="36" r="34"/><path d="M22 37l9.5 9.5L51 27"/></svg>
    <b>Nota salva</b><span id="qDoneTxt"></span>
    <button class="btn" id="qDoneOpen">Abrir a nota</button>
  </div>
  <div class="qn-menu" id="qMenu" hidden></div>
</div>
<script src="quick.js"></script>
</body>
</html>
