name: Publicar versao para Windows

on:
  push:
    branches: [main]
    paths: ['app/**', 'release/**', '.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Montar o ForeverNote
        shell: pwsh
        run: ./release/build-release.ps1

      - name: Montar o instalador (.exe)
        shell: pwsh
        run: ./release/build-setup.ps1

      - name: Testar o instalador (instalar, atualizar, desinstalar)
        shell: pwsh
        run: ./release/test-setup.ps1

      - name: Publicar a versao (Releases)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ver = (Get-Content app/package.json -Raw | ConvertFrom-Json).version
          $info = Get-Content latest.json -Raw | ConvertFrom-Json
          $tag = "v$ver"
          $zip = "out/ForeverNote-v$ver.zip"
          $setup = "out/ForeverNote-Setup-v$ver.exe"
          $notes = @"
          $($info.notes)

          ### Como instalar no PC
          Baixe o **ForeverNote-Setup-v$ver.exe** aqui embaixo, em *Assets*, e de dois cliques.
          Se o Windows mostrar "O Windows protegeu o computador", clique em **Mais informacoes** > **Executar assim mesmo**.

          Ja tem o app? Ele se atualiza sozinho. Suas notas nunca sao apagadas.

          <sub>Prefere sem instalador? Use o ForeverNote-v$ver.zip (extraia e rode o Instalar.bat).</sub>

          **Versao celular:** https://davigerhardt.github.io/ForeverNote/

          by revmpt
          "@
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $setup $zip --clobber
          } else {
            gh release create $tag $setup $zip --title "ForeverNote $tag" --notes $notes --latest
          }
